<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Novels — Biblioteca</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="index.html"><span>▮</span> Novels</a>
  <nav><a class="active" href="index.html">Início</a><a href="#catalogo">Explorar</a><a href="#recentes">Recentes</a></nav>
  <div class="top-actions"><input id="search" placeholder="Buscar por título, autor ou gênero..." aria-label="Buscar"><a class="admin-link" href="admin.html">Área administrativa</a></div>
</header>

<main>
  <section id="hero" class="hero empty">
    <div class="hero-content">
      <div class="eyebrow">BIBLIOTECA DE NOVELS</div>
      <h1>Grandes histórias,<br>sempre.</h1>
      <p>Organize, publique e leia suas novels em um único lugar.</p>
      <a class="btn primary" href="#catalogo">Explorar histórias</a>
    </div>
  </section>

  <section id="catalogo" class="section">
    <div class="section-head"><h2>Em destaque</h2><span id="count"></span></div>
    <div id="featured" class="grid"></div>
  </section>
  <section id="recentes" class="section">
    <div class="section-head"><h2>Mais recentes</h2></div>
    <div id="recent" class="grid"></div>
  </section>
</main>
<footer><div class="brand">▮ Novels</div><span>Uma biblioteca de histórias.</span></footer>
<script type="module" src="js/app.js"></script>
</body>
</html>
