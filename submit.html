<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Adicionar história</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container" style="max-width:800px;margin:60px auto">
    <a href="index.html">← Voltar</a>
    <h1>Adicionar história</h1>
    <p>Qualquer pessoa pode enviar uma história. Ela será publicada no catálogo após o envio.</p>
    <form id="story-form">
      <label>Título<br><input id="title" required maxlength="200"></label><br><br>
      <label>Descrição<br><textarea id="description" rows="4" maxlength="2000"></textarea></label><br><br>
      <label>URL da capa (opcional)<br><input id="cover_url" type="url" placeholder="https://..."></label><br><br>
      <label>História<br><textarea id="content" rows="18" required></textarea></label><br><br>
      <button type="submit">Publicar história</button>
    </form>
    <p id="status"></p>
  </main>
  <script type="module">
    import { supabase } from './js/client.js';
    const form=document.querySelector('#story-form'), status=document.querySelector('#status');
    form.addEventListener('submit', async (e)=>{
      e.preventDefault();
      status.textContent='Publicando...';
      const {error}=await supabase.from('stories').insert({
        title:document.querySelector('#title').value.trim(),
        description:document.querySelector('#description').value.trim(),
        cover_url:document.querySelector('#cover_url').value.trim(),
        content:document.querySelector('#content').value
      });
      if(error){ status.textContent='Erro ao publicar: '+error.message; return; }
      status.textContent='História publicada com sucesso!';
      form.reset();
    });
  </script>
</body>
</html>
