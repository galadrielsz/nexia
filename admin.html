<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Novels — Administração</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<header class="topbar"><a class="brand" href="index.html">▮ Novels</a><nav><a href="index.html">Voltar ao site</a></nav><div class="top-actions"><button id="logout" class="btn ghost hidden">Sair</button></div></header>
<main class="admin-wrap">
  <section id="login-panel" class="panel auth">
    <div class="eyebrow">ACESSO RESTRITO</div><h1>Área administrativa</h1>
    <p>O acesso é protegido por autenticação. O primeiro administrador é criado pelo procedimento de ativação única descrito no README.</p>
    <input id="email" type="email" placeholder="E-mail do administrador">
    <input id="password" type="password" placeholder="Senha">
    <button id="login" class="btn primary">Entrar</button>
    <p id="login-msg" class="msg"></p>
  </section>

  <section id="dashboard" class="hidden">
    <div class="admin-head"><div><div class="eyebrow">PAINEL</div><h1>Gerenciar novels</h1></div><button id="new-story" class="btn primary">+ Nova novel</button></div>
    <div class="panel editor hidden" id="editor">
      <h2 id="editor-title">Nova novel</h2>
      <input id="story-id" type="hidden">
      <label>Título<input id="title"></label>
      <label>Autor<input id="author"></label>
      <label>Gêneros<input id="genres" placeholder="Fantasia, Aventura"></label>
      <label>Descrição<textarea id="description" rows="4"></textarea></label>
      <label>Capa (URL de imagem)<input id="cover" placeholder="https://..."></label>
      <label>Banner (URL de imagem, opcional)<input id="banner"></label>
      <label>Conteúdo / sinopse completa<textarea id="content" rows="10"></textarea></label>
      <label class="check"><input id="featured" type="checkbox"> Em destaque</label>
      <div class="row"><button id="save" class="btn primary">Publicar</button><button id="cancel" class="btn ghost">Cancelar</button></div>
      <p id="save-msg" class="msg"></p>
    </div>
    <div class="panel"><div class="section-head"><h2>Novels publicadas</h2></div><div id="admin-list"></div></div>
  </section>
</main>
<script type="module" src="js/admin.js"></script>
</body>
</html>
